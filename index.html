</style></head><body><div class="app"><header class="top"><span style="font-size:24px">🌱</span><div class="brand">Eetschaal <span class="chip">PRIVÉ OPSLAG</span></div><button class="btn ghost" id="settingsBtn" aria-label="Instellingen">⚙️</button></header><main class="content" id="main"></main><nav class="bottom" id="nav"></nav></div><script>
const DAYS=['Ontbijt','Tussendoor ochtend','Lunch','Tussendoor middag','Avondeten','Tussendoor avond'];
const MICRO=[['Vitamine A',800,'µg'],['Vitamine D',10,'µg'],['Vitamine K',70,'µg'],['Vitamine B12',2.8,'µg'],['Vitamine C',75,'mg'],['Calcium',1000,'mg'],['Kalium',3500,'mg'],['Magnesium',350,'mg'],['IJzer',11,'mg'],['Zink',9,'mg'],['Selenium',70,'µg']];
const HISTORY=[];
const FOODS=[{id:'kwark',name:'Magere kwark',brand:'Milsani Aldi',country:'NL',k:55,p:10,c:3.5,f:.2,fiber:0,water:88,sugar:3.5,alcohol:0,salt:.1},{id:'oats',name:'Havermout',brand:'Generiek',country:'NL',k:370,p:13,c:60,f:7,fiber:10,water:8,sugar:1,alcohol:0,salt:.01},{id:'milk',name:'Halfvolle melk',brand:'Generiek',country:'NL',k:47,p:3.5,c:4.8,f:1.5,fiber:0,water:90,sugar:4.8,alcohol:0,salt:.1,drink:true},{id:'water',name:'Water',brand:'Generiek',country:'NL',k:0,p:0,c:0,f:0,fiber:0,water:100,sugar:0,alcohol:0,salt:0,drink:true},{id:'banana',name:'Banaan',brand:'Generiek',country:'NL',k:89,p:1.1,c:20.2,f:.3,fiber:2.6,water:75,sugar:12,alcohol:0,salt:0}];
const DEF={profile:{birth:'2000-01-01',height:170,weight:70,sex:'male',goalWeight:''},goals:{k:2000,p:110,c:240,f:65,water:2000,rate:0},calc:{method:'custom',activity:1.4,custom:2000,proteinFactor:1.6,fatPercent:25},micros:MICRO.map(x=>({name:x[0],target:x[1],unit:x[2],visible:true})),diary:{},weighins:[],history:[],recipes:[],customFoods:[],appearance:{accent:'#79c4ff',theme:'dark'},weighDay:1};
function copy(x){return JSON.parse(JSON.stringify(x))}let db;try{db=JSON.parse(localStorage.getItem('eetschaal_web_v1'))}catch(e){}if(!db||!db.profile||!db.diary)db=copy(DEF);function save(){localStorage.setItem('eetschaal_web_v1',JSON.stringify(db))}save();
let tab='Dagboek',setting=false,section='macro',date=new Date().toISOString().slice(0,10),metric='k',mealOpen='Ontbijt',dialog='',mealFor='',editing=-1,query='',chosen='kwark',quantity='100',period='all',week=0,graph='graph',unit='pct',fluidOpen=false,selectedRecipe=-1,recipeIngredients=[],recipeName='',recipeServings=2,notice='',undo=null,historyFilter='all',microFilter='all';const $=id=>document.getElementById(id),round=(v,d=0)=>Number(v).toLocaleString('nl-NL',{maximumFractionDigits:d}),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function iso(d){return new Date(d+'T12:00:00')}function nice(d){return iso(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})}function shift(d,n){let v=iso(d);v.setDate(v.getDate()+n);return v.toISOString().slice(0,10)}function foods(){return [...FOODS,...db.customFoods]}function food(id){return foods().find(f=>f.id===id)}function allEntries(day=date){return db.diary[day]||[]}function dayTotal(k,day=date){return allEntries(day).reduce((s,e)=>s+(Number(food(e.food)?.[k])||0)*e.qty/100,0)}function goalCalc(){let bmr=10*db.profile.weight+6.25*db.profile.height-5*((new Date().getFullYear())-Number(db.profile.birth.slice(0,4)))+(db.profile.sex==='male'?5:-161);let h=db.history.slice().sort((a,b)=>a[0].localeCompare(b[0])).slice(-5,-1);let monthly=h.length===4&&db.weighins.filter(w=>w.official).length>=5?(h.reduce((s,r)=>s+r[2],0)/4+(db.weighins.filter(w=>w.official).sort((a,b)=>a.date.localeCompare(b.date)).at(-5)?.kg-db.weighins.filter(w=>w.official).sort((a,b)=>a.date.localeCompare(b.date)).at(-1)?.kg)*1100/4):null;let maint=db.calc.method==='formula'?bmr*db.calc.activity:db.calc.method==='month'?monthly:Number(db.calc.custom);let kc=maint+db.goals.rate*1100;return{bmr,maint,kc,p:db.profile.weight*db.calc.proteinFactor,f:kc*db.calc.fatPercent/900,c:(kc-(db.profile.weight*db.calc.proteinFactor)*4-(kc*db.calc.fatPercent/900)*9)/4}}function toast(x){notice=x;render();setTimeout(()=>{if(notice===x){notice='';let n=$('notice');if(n)n.remove()}},5500)}
function nav(){return ['Dagboek','Overzicht','Gewicht','Gerechten'].map((t,i)=>`<button class="${tab===t?'active':''}" onclick="changeTab('${t}')">${['▤','▥','⚖','♨'][i]}<br>${t}</button>`).join('')};function changeTab(t){tab=t;setting=false;dialog='';render()}function render(){document.documentElement.style.setProperty('--accent',db.appearance.accent);$('nav').innerHTML=setting?'':nav();$('settingsBtn').innerText=setting?'←':'⚙️';$('main').innerHTML=(notice?`<div id="notice" class="notice">${esc(notice)}</div>`:'')+(setting?renderSettings():tab==='Dagboek'?renderDiary():tab==='Gewicht'?renderWeight():tab==='Overzicht'?renderOverview():renderRecipes());if(tab==='Gewicht'&&!setting&&period!=='one'&&graph==='graph')drawWeight();if(tab==='Overzicht'&&!setting&&period!=='one'&&graph==='graph')drawEnergy()};$('settingsBtn').onclick=()=>{setting=!setting;dialog='';render()};
function progress(x,g,color){return `<div class="progress"><span style="width:${Math.min(100,Math.max(0,x/g*100))}%;background:${color}"></span></div>`}function renderDiary(){let met=[['k','Kcal'],['p','Eiwit'],['c','Koolh.'],['f','Vet'],['fiber','Vezels']];if(dayTotal('alcohol')>0)met.push(['alcohol','Alcohol']);let v=`<div class="row between"><h1 class="title">Dagboek</h1><div class="row"><button class="btn small ghost" onclick="date=shift(date,-1);render()">‹</button><span class="small">${nice(date)}</span><button class="btn small ghost" onclick="date=shift(date,1);render()">›</button></div></div><div class="card secondary"><div><strong style="font-size:26px">${round(dayTotal('k'))}</strong> <span class="muted">/ ${round(db.goals.k)} kcal</span></div>${progress(dayTotal('k'),db.goals.k,'var(--accent)')}<div class="grid3">${[['p','Eiwit','var(--p)'],['c','Koolh.','var(--c)'],['f','Vet','var(--f)']].map(([k,n,c])=>`<div><div class="tiny muted">${n}</div><div class="small" style="color:${c}">${round(dayTotal(k),1)}/${round(db.goals[k])} g</div>${progress(dayTotal(k),db.goals[k],c)}</div>`).join('')}</div></div><div class="small muted">Per maaltijd en product</div><div class="tabrow">${met.map(([k,n])=>`<button class="${metric===k?'active':''}" onclick="metric='${k}';render()">${n}</button>`).join('')}</div>`;
for(let m of DAYS){let list=allEntries().filter(e=>e.meal===m);let total=list.reduce((s,e)=>s+(Number(food(e.food)?.[metric])||0)*e.qty/100,0);v+=`<div class="card"><button class="mealhead" onclick="mealOpen=mealOpen==='${m}'?'':'${m}';render()"><span>${m}</span><span style="color:var(--accent);font-weight:500">${round(total,metric==='k'?0:1)} ${metric==='k'?'kcal':'g'} ${mealOpen===m?'⌃':'⌄'}</span></button>${mealOpen===m?`<div class="panel">${list.map(e=>`<div class="entry"><div class="details">${esc(food(e.food)?.name||'Onbekend product')}<small>${round(e.qty)} g/ml</small></div><span class="small">${round((food(e.food)?.[metric]||0)*e.qty/100,1)}</span><button class="btn small ghost" onclick="editFood('${esc(e.id)}')">✎</button><button class="btn small ghost" onclick="removeEntry('${esc(e.id)}')">✕</button></div>`).join('')}<button class="btn" style="width:100%;margin-top:8px" onclick="openAdd('${m}')">＋ Product toevoegen</button></div>`:''}</div>`}v+=`<div class="card"><button class="section-header" onclick="fluidOpen=!fluidOpen;render()"><span>💧 Totale vochtinname</span><span>${round(dayTotal('water'))}/${round(db.goals.water)} ml ${fluidOpen?'⌃':'⌄'}</span></button><div class="splitbar"><span style="background:#39c9e8;width:${Math.min(100,allEntries().filter(e=>food(e.food)?.drink).reduce((s,e)=>s+(food(e.food)?.water||0)*e.qty/100,0)/db.goals.water*100)}%"></span><span style="background:#79d6a8;width:${Math.min(100,allEntries().filter(e=>!food(e.food)?.drink).reduce((s,e)=>s+(food(e.food)?.water||0)*e.qty/100,0)/db.goals.water*100)}%"></span></div>${fluidOpen?'<p class="small muted">Blauw: uit dranken · groen: uit eten. Onbekende vochtwaarden worden niet meegerekend.</p>':''}</div>`;if(undo)v+=`<button class="btn" onclick="restoreRemoved()">↶ Verwijdering ongedaan maken</button>`;v+=`<div class="row"><button class="btn" onclick="copyYesterday()">Vorige dag kopiëren</button><button class="btn" onclick="copyMeal()">Maaltijd kopiëren</button></div>`;if(dialog==='add')v+=renderFoodDialog();if(dialog==='newfood')v+=renderNewFood();return v}
function openAdd(meal){dialog='add';mealFor=meal;editing=-1;query='';chosen='kwark';quantity='100';render();$('searchFood')?.focus()}function editFood(id){let e=allEntries().find(e=>String(e.id)===String(id));if(!e)return;dialog='add';mealFor=e.meal;editing=e.id;chosen=e.food;quantity=String(e.qty);query='';render()}function removeEntry(id){let a=allEntries(),idx=a.findIndex(e=>String(e.id)===String(id));if(idx<0)return;undo={date,entry:a[idx],idx};a.splice(idx,1);save();render()}function restoreRemoved(){if(undo){(db.diary[undo.date]||[]).splice(undo.idx,0,undo.entry);undo=null;save();render()}}function copyYesterday(){let old=allEntries(shift(date,-1));if(allEntries().length)return toast('Deze dag is niet leeg; kopiëren is alleen mogelijk naar een lege dag.');db.diary[date]=old.map((e,i)=>({...e,id:'copy'+Date.now()+i}));save();toast(`${old.length} producten uit de vorige dag gekopieerd.`)}function copyMeal(){let from=prompt('Van welke datum kopiëren? (JJJJ-MM-DD)',shift(date,-1));if(!/^\d{4}-\d{2}-\d{2}$/.test(from||''))return;let meal=prompt('Welke maaltijd? Kies exact een van: '+DAYS.join(', '),'Ontbijt');if(!DAYS.includes(meal))return toast('Onbekende maaltijd.');let copied=allEntries(from).filter(e=>e.meal===meal);db.diary[date]??=[];db.diary[date].push(...copied.map((e,i)=>({...e,id:'meal'+Date.now()+i})));save();toast(`${copied.length} producten gekopieerd naar ${meal}.`)}
function rankFood(f,q){let t=(f.name+' '+f.brand).toLowerCase(),words=q.toLowerCase().split(/\s+/).filter(Boolean);let exact=t.includes(q.toLowerCase())?100:0;let matched=words.filter(w=>t.includes(w)||({kwrak:'kwark',magre:'magere',haferflocken:'havermout',oats:'havermout',flocons:'havermout'}[w]||'')&&t.includes(({kwrak:'kwark',magre:'magere',haferflocken:'havermout',oats:'havermout',flocons:'havermout'}[w]||'___'))).length;return exact+matched*20+({NL:6,BE:5,DE:4,GB:1,FR:1}[f.country]||0)}function renderFoodDialog(){let result=foods().filter(f=>!query||rankFood(f,query)>3).sort((a,b)=>rankFood(b,query)-rankFood(a,query)).slice(0,30);return `<div class="card secondary" id="addPanel"><div class="row between"><strong>${editing!==-1?'Product bewerken':'Product toevoegen'}</strong><button class="btn small ghost" onclick="dialog='';render()">✕</button></div><div class="row" style="margin-top:10px"><input id="searchFood" placeholder="Merk of product zoeken" value="${esc(query)}" oninput="query=this.value;refreshResults()"><button class="btn" title="Barcode scannen" onclick="scanBarcode()">▦</button></div><p class="tiny muted">NL / BE / DE eerst; GB / FR ook doorzoekbaar. Testproducten zijn voorbeelden.</p><div id="results">${foodResults(result)}</div><label class="label">Hoeveelheid (g/ml)</label><input id="foodQty" inputmode="decimal" value="${esc(quantity)}"><button class="btn primary" style="width:100%;margin-top:10px" onclick="saveFoodEntry()">${editing!==-1?'Wijziging opslaan':'Toevoegen aan maaltijd'}</button><button class="btn ghost" onclick="dialog='newfood';render()">＋ Eigen product aanmaken</button></div>`}function foodResults(list){return list.map(f=>`<label class="choice"><input type="radio" name="chosen" ${chosen===f.id?'checked':''} onchange="chosen='${esc(f.id)}'"><span>${esc(f.name)} <span class="muted small">${esc(f.brand)} · ${esc(f.country)}</span></span></label>`).join('')||'<div class="small muted">Geen voorbeeldresultaten. Maak zelf een product aan.</div>'}function refreshResults(){let result=foods().filter(f=>!query||rankFood(f,query)>3).sort((a,b)=>rankFood(b,query)-rankFood(a,query)).slice(0,30);$('results').innerHTML=foodResults(result)}function saveFoodEntry(){let q=Number($('foodQty').value.replace(',','.'));if(!(q>0))return toast('Voer een geldige hoeveelheid in.');db.diary[date]??=[];if(editing!==-1){let e=db.diary[date].find(x=>x.id===editing);if(e){e.food=chosen;e.qty=q}}else db.diary[date].push({id:'e'+Date.now()+Math.random().toString(36).slice(2,5),meal:mealFor,food:chosen,qty:q});dialog='';save();toast('Product opgeslagen.')}function renderNewFood(){return `<div class="card secondary"><strong>Eigen product aanmaken</strong><label class="label">Productnaam</label><input id="newName" placeholder="Naam" required><label class="label">Merk / supermarkt</label><input id="newBrand" placeholder="Merk"><p class="small muted">Voer waarden in per 100 g/ml. Energie, koolhydraten, eiwitten, vetten en zout zijn verplicht.</p><div class="grid2">${[['k','Kcal'],['c','Koolhydraten (g)'],['p','Eiwitten (g)'],['f','Vetten (g)'],['salt','Zout (g)'],['fiber','Vezels (g)'],['sugar','Suikers (g)'],['water','Water (ml)'],['alcohol','Alcohol (g)']].map(([k,n])=>`<div><label class="label">${n}</label><input id="new_${k}" type="number" step="any" min="0" placeholder="${['k','c','p','f','salt'].includes(k)?'Verplicht':'Onbekend'}"></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveNewFood()">Product opslaan</button><button class="btn ghost" onclick="dialog='add';render()">Terug</button></div></div>`}function saveNewFood(){let name=$('newName').value.trim(),keys=['k','c','p','f','salt'];if(!name||keys.some(k=>$('new_'+k).value===''))return toast('Naam, kcal, koolhydraten, eiwitten, vetten en zout zijn verplicht.');let f={id:'own'+Date.now(),name,brand:$('newBrand').value.trim()||'Eigen product',country:'NL',drink:false};for(let k of ['k','c','p','f','salt','fiber','sugar','water','alcohol'])f[k]=$('new_'+k).value===''?null:Number($('new_'+k).value);db.customFoods.push(f);chosen=f.id;dialog='add';save();render();toast('Eigen product opgeslagen.')}
function scanBarcode(){let v=prompt('Barcode (EAN-8 of EAN-13). Voor camerascannen is een HTTPS-verbinding en een geschikte scannerbibliotheek nodig:');if(!v)return;if(!/^\d{8}$|^\d{13}$/.test(v))return toast('Voer 8 of 13 cijfers in.');fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(v)+'.json').then(r=>r.json()).then(data=>{if(data.status!==1)return toast('Barcode niet gevonden. Je kunt het product handmatig maken.');let p=data.product,n=p.nutriments||{};let f={id:'ean'+v,name:p.product_name||'Product '+v,brand:p.brands||'Onbekend',country:'NL',k:Number(n['energy-kcal_100g']||0),p:Number(n.proteins_100g||0),c:Number(n.carbohydrates_100g||0),f:Number(n.fat_100g||0),fiber:n.fiber_100g==null?null:Number(n.fiber_100g),water:null,sugar:n.sugars_100g==null?null:Number(n.sugars_100g),alcohol:null,salt:n.salt_100g==null?null:Number(n.salt_100g)};db.customFoods.push(f);chosen=f.id;save();render();toast('Barcode gevonden. Controleer altijd naam en voedingswaarden.')}).catch(()=>toast('Online zoeken niet beschikbaar. Controleer je internetverbinding.'))}
function drawLine(c,pts,color,min,max){let ctx=c.getContext('2d'),w=c.width=640,h=c.height=400;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#304764';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=35+i*75;ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(w-20,y);ctx.stroke();ctx.fillStyle='#91abc9';ctx.font='18px sans-serif';ctx.fillText(round(max-(max-min)*i/4,1),1,y+5)}ctx.strokeStyle=color;ctx.lineWidth=4;ctx.beginPath();pts.forEach((v,i)=>{let x=45+i*(w-70)/Math.max(1,pts.length-1),y=35+(max-v)/(max-min)*300;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle=color;pts.forEach((v,i)=>{let x=45+i*(w-70)/Math.max(1,pts.length-1),y=35+(max-v)/(max-min)*300;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()})}
function weightPeriod(){let a=[...db.weighins].filter(w=>w.official).sort((x,y)=>x.date.localeCompare(y.date));if(period==='four'){const cutoff=new Date();cutoff.setDate(cutoff.getDate()-28);a=a.filter(w=>w.date>=cutoff.toISOString().slice(0,10));}if(period==='one')a=a.slice(week,week+2);return a}function renderWeight(){let w=weightPeriod(),first=w[0],last=w.at(-1),n=first&&last?(iso(last.date)-iso(first.date))/604800000:0,lost=first&&last?first.kg-last.kg:0;let per=n?lost/n:null;let validGoal=Number(db.profile.goalWeight)>0&&first&&Number(db.profile.goalWeight)<first.kg;let p=`<h1 class="title">Gewicht</h1><button class="btn primary" style="width:100%" onclick="dialog=dialog==='weight'?'':'weight';render()">＋ Gewicht registreren</button>`;if(dialog==='weight')p+=`<div class="card secondary"><label class="label">Datum</label><input id="weightDate" type="date" value="${new Date().toISOString().slice(0,10)}"><label class="label">Gewicht (kg)</label><input id="weightKg" inputmode="decimal" placeholder="Bijv. 109,3"><p class="small muted">Maandag is de officiële weegdag; andere dagen zijn extra metingen.</p><button class="btn primary" onclick="saveWeight()">Meting opslaan</button></div>`;p+=periodControl();if(period==='one')p+=`<div class="row between"><button class="btn small" onclick="week=Math.max(0,week-1);render()">‹</button><strong>Week ${week+1} – ${week+2}</strong><button class="btn small" onclick="week=Math.min(Math.max(0,db.weighins.filter(w=>w.official).length-2),week+1);render()">›</button></div>`;p+=`<div class="card secondary"><div class="subtitle">Gewichtsvoortgang</div><div class="grid2"><div class="stat"><div class="small muted">Laatste officiële weging</div><strong>${last?round(last.kg)+' kg':'—'}</strong></div><div class="stat"><div class="small muted">Gewichtsverlies</div><strong class="ok">${round(lost)} kg</strong></div><div class="stat"><div class="small muted">Gem. afvalsnelheid</div><strong>${per===null?'—':round(per,2)+' kg/week'}</strong></div><div class="stat"><div class="small muted">Voltooide weken</div><strong>${round(n)}</strong></div></div><label class="label">Streefgewicht (optioneel)</label><div class="row"><input type="number" value="${esc(db.profile.goalWeight)}" placeholder="Niet ingesteld" onchange="db.profile.goalWeight=this.value;save();render()"></div>${validGoal?progress(lost,first.kg-db.profile.goalWeight,'var(--fiber)'):''}</div>`;if(period!=='one'){p+=`<div class="card"><div class="row between"><strong>Gewichtsverloop</strong><div class="tabrow"><button class="${graph==='graph'?'active':''}" onclick="graph='graph';render()">Grafiek</button><button class="${graph==='table'?'active':''}" onclick="graph='table';render()">Tabel</button></div></div>${graph==='graph'?'<canvas id="weightCanvas"></canvas>':`<div class="scrollx"><table><tr><th>Datum</th><th>Gewicht</th></tr>${w.map(x=>`<tr><td>${nice(x.date)}</td><td>${round(x.kg)} kg</td></tr>`).join('')}</table></div>`}<p class="tiny muted">Blauw: werkelijke officiële wegingen. Geen trendlijn.</p></div><div class="card"><strong>Geschatte maintenance</strong><p class="small muted">Voorlopige schatting. Alleen betrouwbaar te gebruiken als ten minste vier volledige weken én voldoende voedingsregistraties zijn bevestigd.</p><div>${n>=4?round((db.history.filter(r=>r[0]>=first.date&&r[0]<last.date).reduce((s,r)=>s+r[2],0)/Math.max(1,db.history.filter(r=>r[0]>=first.date&&r[0]<last.date).length))+per*1100)+' kcal/dag (voorlopig)':'Minimaal 4 volledige weken nodig'}</div></div>`}return p}function saveWeight(){let d=$('weightDate').value,kg=Number($('weightKg').value.replace(',','.'));if(!d||!(kg>0&&kg<500))return toast('Vul een geldige datum en gewicht in.');let official=iso(d).getDay()===db.weighDay;let exists=db.weighins.find(w=>w.date===d);if(exists&&!confirm('Er is al een weging op deze datum. Vervangen?'))return;db.weighins=db.weighins.filter(w=>w.date!==d);db.weighins.push({date:d,kg,official,imported:false});save();dialog='';toast('Weging opgeslagen.')}function drawWeight(){let w=weightPeriod();if(!w.length)return;let a=w.map(x=>x.kg);drawLine($('weightCanvas'),a,'#79c4ff',Math.min(...a)-1,Math.max(...a)+1)}
function periodControl(){return `<div class="tabrow">${[['all','Alle weken'],['four','Laatste 4 weken'],['one','Per week']].map(([v,n])=>`<button class="${period===v?'active':''}" onclick="period='${v}';render()">${n}</button>`).join('')}</div>`}function historyRows(){return period==='all'?db.history:period==='four'?db.history.slice(-4):db.history.length?[db.history[Math.min(week,db.history.length-1)]]:[]}function renderOverview(){let a=historyRows();if(!a.length)return '<h1 class="title">Overzicht</h1><div class="card"><strong>Nog geen voedingsgeschiedenis</strong><p class="small muted">Je kunt privégegevens uitsluitend in je eigen browser importeren via Instellingen → Gegevens en opslag.</p></div>';let avg=i=>a.reduce((s,r)=>s+r[i],0)/a.length,defs=[['Eiwit',4,'var(--p)'],['Koolhydraten',3,'var(--c)'],['Vet',5,'var(--f)'],['Vezels',6,'var(--fiber)'],['Alcohol',7,'var(--accent)']];let p=`<h1 class="title">Overzicht</h1>${periodControl()}`;if(period==='one')p+=`<div class="row between"><button class="btn small" onclick="week=Math.max(0,week-1);render()">‹</button><strong>Week ${week+1} · ${nice(a[0][0])}</strong><button class="btn small" onclick="week=Math.min(Math.max(0,db.history.length-1),week+1);render()">›</button></div>`;p+=`<div class="card secondary"><strong>Gemiddeld per dag</strong><div class="stack" style="margin-top:10px">${[['Calorieën',2,'kcal'],['Eiwitten',4,'g'],['Koolhydraten',3,'g'],['Vetten',5,'g'],['Vezels',6,'g'],['Alcohol',7,'g']].map(([n,i,u])=>`<div class="row between small"><span>${n}</span><strong>${round(avg(i),1)} ${u}</strong></div>`).join('')}</div></div>`;if(period!=='one')p+=`<div class="card"><div class="row between"><strong>Energieverdeling</strong><div class="tabrow"><button class="${unit==='pct'?'active':''}" onclick="unit='pct';render()">%</button><button class="${unit==='kcal'?'active':''}" onclick="unit='kcal';render()">kcal</button></div></div><div class="tabrow"><button class="${graph==='graph'?'active':''}" onclick="graph='graph';render()">Grafiek</button><button class="${graph==='table'?'active':''}" onclick="graph='table';render()">Tabel</button></div>${graph==='graph'?'<canvas id="energyCanvas"></canvas>':energyTable(a,unit)}<div class="small muted">${defs.map(([n,i,c])=>`<span style="color:${c}">●</span> ${n}`).join(' · ')}</div></div><div class="card"><strong>Gram per dag per week</strong>${energyTable(a,'gram')}</div>`;p+=`<div class="card"><div class="row between"><strong>Micronutriënten</strong><select style="width:150px" onchange="microFilter=this.value;render()"><option value="all" ${microFilter==='all'?'selected':''}>Alle</option><option value="under" ${microFilter==='under'?'selected':''}>Te laag</option><option value="met" ${microFilter==='met'?'selected':''}>Voldoende</option><option value="excess" ${microFilter==='excess'?'selected':''}>Te hoog</option></select></div><p class="small muted">Historische weekgemiddelden bevatten geen micronutriënten. Onbekend is niet nul.</p>${db.micros.filter(m=>m.visible).map(m=>`<div class="row between small" style="padding:5px 0"><span>${esc(m.name)}</span><span class="muted">Onbekend · doel ${esc(m.target)} ${m.unit}</span></div>`).join('')}</div><div class="card"><strong>Overige voedingswaarden en vocht</strong><p class="small muted">Vezels: ${round(avg(6),1)} g/dag · Alcohol: ${round(avg(7),1)} g/dag</p><p class="small muted">Suikers en vocht zijn voor de geïmporteerde perioden onbekend.</p></div>`;return p}function energyTable(a,mode){let defs=[['Koolh.',3,4],['Eiwit',4,4],['Vet',5,9],['Vezels',6,2],['Alcohol',7,7]];return `<div class="scrollx"><table><tr><th>Week</th>${defs.map(x=>'<th>'+x[0]+'</th>').join('')}</tr>${a.map(r=>{let tot=defs.reduce((s,d)=>s+r[d[1]]*d[2],0);return `<tr><td>${nice(r[0])}</td>${defs.map(d=>`<td>${round(mode==='gram'?r[d[1]]:mode==='pct'?100*r[d[1]]*d[2]/tot:r[d[1]]*d[2],1)}</td>`).join('')}</tr>`}).join('')}</table></div>`}function drawEnergy(){let c=$('energyCanvas');if(!c)return;let a=historyRows(),ctx=c.getContext('2d'),w=c.width=640,h=c.height=400;ctx.clearRect(0,0,w,h);let src=[[3,4,'#ffb454'],[4,4,'#39d3dc'],[5,9,'#c39bff'],[6,2,'#36d48b'],[7,7,'#79c4ff']];let ymax=unit==='pct'?100:3000;let bw=(w-58)/a.length;for(let i=0;i<a.length;i++){let r=a[i],tot=src.reduce((s,d)=>s+r[d[0]]*d[1],0),acc=0;for(let [idx,mul,color] of src){let val=unit==='pct'?100*r[idx]*mul/tot:r[idx]*mul,hh=val/ymax*330;ctx.fillStyle=color;ctx.fillRect(45+i*bw,365-acc-hh,Math.max(3,bw-4),hh);acc+=hh}}}
function renderRecipes(){return `<h1 class="title">Gerechten</h1><div class="card"><strong>Mijn gerechten</strong>${db.recipes.length?db.recipes.map((r,i)=>`<div class="entry"><div class="details">${esc(r.name)}<small>${r.servings} porties · ${round(recipeNutr(r,'k'))} kcal/portie</small></div><button class="btn small" onclick="addRecipeToDiary(${i})">＋</button><button class="btn small ghost" onclick="editRecipe(${i})">✎</button><button class="btn small ghost" onclick="deleteRecipe(${i})">✕</button></div>`).join(''):'<p class="small muted">Je Excel-geschiedenis bevat geen recepten.</p>'}<button class="btn primary" onclick="selectedRecipe=-1;recipeName=\'\';recipeIngredients=[];recipeServings=2;dialog=\'recipe\';render()">＋ Nieuw gerecht</button></div>${dialog==='recipe'?renderRecipeEditor():''}`};function recipeNutr(r,k){return r.ingredients.reduce((s,e)=>s+(food(e.food)?.[k]||0)*e.qty/100,0)/r.servings}function editRecipe(i){selectedRecipe=i;let r=db.recipes[i];recipeName=r.name;recipeServings=r.servings;recipeIngredients=copy(r.ingredients);dialog='recipe';render()}function deleteRecipe(i){if(!confirm('Gerecht verwijderen?'))return;db.recipes.splice(i,1);save();render()}function addRecipeToDiary(i){let r=db.recipes[i],meal=prompt('Aan welke maaltijd toevoegen? '+DAYS.join(', '),'Avondeten');if(!DAYS.includes(meal))return;db.diary[date]??=[];r.ingredients.forEach((e,n)=>db.diary[date].push({id:'rec'+Date.now()+n,meal,food:e.food,qty:e.qty/r.servings}));save();toast('Een portie aan je Dagboek toegevoegd.')}function renderRecipeEditor(){return `<div class="card secondary"><strong>Gerecht ${selectedRecipe<0?'aanmaken':'bewerken'}</strong><label class="label">Naam</label><input id="recipeName" value="${esc(recipeName)}" oninput="recipeName=this.value"><label class="label">Aantal porties</label><input id="recipeServings" type="number" min="1" value="${recipeServings}" onchange="recipeServings=Number(this.value)"><label class="label">Ingrediënten</label>${recipeIngredients.map((e,i)=>`<div class="row small">${esc(food(e.food)?.name||'Product')} · ${round(e.qty)} g/ml <button class="btn small ghost" onclick="recipeIngredients.splice(${i},1);render()">✕</button></div>`).join('')}<div class="formrow"><select id="recipeFood">${foods().map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('')}</select><input id="recipeQty" type="number" placeholder="Hoeveelheid (g)" min="1"></div><div class="row"><button class="btn" onclick="addIngredient()">＋ Ingrediënt</button><button class="btn primary" onclick="saveRecipe()">Gerecht opslaan</button></div></div>`}function addIngredient(){let q=Number($('recipeQty').value);if(!(q>0))return toast('Voer een hoeveelheid in.');recipeIngredients.push({food:$('recipeFood').value,qty:q});render()}function saveRecipe(){if(!recipeName.trim()||!(recipeServings>0)||!recipeIngredients.length)return toast('Naam, porties en ingrediënten zijn vereist.');let r={name:recipeName.trim(),servings:recipeServings,ingredients:copy(recipeIngredients)};if(selectedRecipe<0)db.recipes.push(r);else db.recipes[selectedRecipe]=r;dialog='';save();toast('Gerecht opgeslagen.')}
function openPanel(id){section=section===id?'':id;render()}function settingCard(id,name,content){return `<div class="card"><button class="section-header" onclick="openPanel('${id}')"><span>${name}</span><span>${section===id?'⌃':'⌄'}</span></button>${section===id?`<div class="panel">${content}</div>`:''}</div>`}function setDeep(group,k,val){db[group][k]=val;save();render()}function renderSettings(){let calc=goalCalc(),level=[1.2,1.35,1.4,1.6,1.8,2],labels=['Zeer weinig actief','Weinig actief','Licht actief','Matig actief','Actief','Zeer actief'],desc=['Bijna altijd zitten, nauwelijks beweging.','Veel zitten, wat lopen/fietsen en enkele sportmomenten.','Meestal zittend, regelmatig wandelen, fietsen of sporten.','Dagelijks behoorlijk bewegen, meerdere sportmomenten.','Veel staan, lopen of fysiek werk.','Zware fysieke arbeid of zeer intensief bewegen.'];let levelIdx=level.indexOf(Number(db.calc.activity));if(levelIdx<0)levelIdx=1;

abel">Vetpercentage: <strong>${round(db.calc.fatPercent,1)}%</strong></label><input type="range" min="15" max="40" step="0.5" value="${db.calc.fatPercent}" oninput="db.calc.fatPercent=Number(this.value);save();render()"><div class="grid3"><div class="stat small">Eiwit<strong>${round(calc.p)} g</strong></div><div class="stat small">Koolh.<strong>${round(calc.c)} g</strong></div><div class="stat small">Vet<strong>${round(calc.f)} g</strong></div></div><p class="tiny muted">Je dagelijkse doelen wijzigen pas wanneer je hieronder bevestigt.</p><button class="btn primary" ${calc.kc>0&&calc.c>=0?'':'disabled'} onclick="confirmMacro()">Nieuwe doelen bevestigen</button>`;

let storage=`<p class="small">Historische weekgegevens: ${db.history.length} lokaal opgeslagen weekregels en ${db.weighins.filter(w=>w.imported).length} oorspronkelijke wegingen.</p><label class="label">Importeer historische weken (.csv / .json)</label><input id="importFile" type="file" accept=".csv,.json,text/csv,application/json"><button class="btn" onclick="importHistory()">Bestand bekijken en importeren</button><p class="tiny muted">Maximaal 52 weken per import; dubbele datums worden overgeslagen. Voor .xlsx is omzetting naar .csv nodig in deze lichte browserversie.</p><div class="row" style="margin-top:12px"><button class="btn" onclick="exportData()">Back-up exporteren</button><button class="btn" onclick="undoImport()">Laatste import terugdraaien</button></div><label class="label">Back-up terugzetten (.json)</label><input type="file" id="backupFile" accept=".json"><button class="btn" onclick="restoreBackup()">Back-up herstellen</button><button class="btn ghost" onclick="resetData()" style="margin-top:15px">Testgegevens terugzetten naar beginstand</button>`;
return `<h1 class="title">Instellingen</h1><div class="notice">Je wijzigingen worden lokaal opgeslagen in deze browser. Bevestig macrodoelen apart.</div>${settingCard('profile','📏 Lichaamsmetingen',profile)}${settingCard('macro','🎯 Calorieën en macro’s',macro)}${settingCard('weigh','📅 Officiële meetpunten',weigh)}${settingCard('template','📋 Dagelijkse consumpties',`<p class="small muted">Maaltijden of een vorige dag kopiëren kan vanuit Dagboek. Een dagtemplate wordt alleen handmatig toegepast op een volledig lege dag.</p>`)}${settingCard('micro','💊 Voedingsstoffen en doelen',micro)}${settingCard('fluid','💧 Vochtbalans',other)}${settingCard('appearance','🎨 Weergave',appearance)}${settingCard('missing','❔ Ontbrekende voedingswaarden','<p class="small muted">Ontbrekende productwaarden blijven onbekend; ze worden niet stilzwijgend nul gemaakt. Controleer online voedingswaarden altijd bij twijfel.</p>')}${settingCard('storage','🗄 Gegevens en opslag',storage)}`}
function confirmMacro(){let c=goalCalc();if(!(c.kc>0&&c.c>=0))return toast('Ongeldig caloriedoel of macroverdeling.');db.goals.k=Math.round(c.kc);db.goals.p=Math.round(c.p);db.goals.c=Math.round(c.c);db.goals.f=Math.round(c.f);save();toast('Nieuwe calorie- en macrodoelen bevestigd.')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='eetschaal-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restoreBackup(){let f=$('backupFile')?.files?.[0];if(!f)return toast('Kies eerst een JSON-back-up.');f.text().then(t=>{let x;try{x=JSON.parse(t)}catch(e){return toast('Ongeldige JSON-back-up.')};if(!x.profile||!x.diary||!x.history)return toast('Dit is geen geldige Eetschaal-back-up.');if(!confirm('Huidige browsergegevens vervangen door deze back-up?'))return;db=x;save();toast('Back-up hersteld.')})}function resetData(){if(!confirm('Alle lokale testwijzigingen verwijderen en de lege beginstand herstellen?'))return;db=copy(DEF);save();render()}
function importHistory(){let f=$('importFile')?.files?.[0];if(!f)return toast('Selecteer eerst een CSV- of JSON-bestand.');f.text().then(t=>{let rows=[];try{if(f.name.toLowerCase().endsWith('.json')){let a=JSON.parse(t);rows=Array.isArray(a)?a:Array.isArray(a.history)?a.history:[]}else{let ls=t.trim().split(/\r?\n/),sep=ls[0].includes(';')?';':',';let headers=ls.shift().split(sep).map(s=>s.trim().toLowerCase());rows=ls.map(line=>{let c=line.split(sep).map(s=>s.trim().replace(/^"|"$/g,''));let obj={};headers.forEach((h,i)=>obj[h]=c[i]);return [obj.date||obj.datum||obj.week,obj.weight||obj.gewicht||'',obj.kcal||obj.calorieen||obj.calorieën||'',obj.carbs||obj.koolhydraten||'',obj.protein||obj.eiwit||'',obj.fat||obj.vet||'',obj.fiber||obj.vezels||'',obj.alcohol||'']})}}catch(e){return toast('Bestand niet leesbaar.')}rows=rows.map(r=>Array.isArray(r)?r:null).filter(r=>r&&/^\d{4}-\d{2}-\d{2}$/.test(String(r[0]))).map(r=>[r[0],...r.slice(1,8).map(x=>Number(String(x).replace(',','.'))||0)]).sort((a,b)=>a[0].localeCompare(b[0]));if(rows.length>52){if(confirm(`${rows.length} weken gevonden. Alleen de laatste 52 importeren?`))rows=rows.slice(-52);else return}if(!rows.length)return toast('Geen herkende regels. Gebruik datum als JJJJ-MM-DD en kolommen date,weight,kcal,carbs,protein,fat,fiber,alcohol.');let dupe=rows.filter(r=>db.history.some(h=>h[0]===r[0])).length;if(!confirm(`${rows.length} regels gevonden, ${dupe} bestaande datums (worden overgeslagen). De overige importeren?`))return;window._lastImport={history:copy(db.history),weighins:copy(db.weighins)};let added=0;for(let r of rows){if(db.history.some(h=>h[0]===r[0]))continue;db.history.push(r);if(r[1]>0&&!db.weighins.some(w=>w.date===r[0]))db.weighins.push({date:r[0],kg:r[1],official:iso(r[0]).getDay()===db.weighDay,imported:true});added++}db.history.sort((a,b)=>a[0].localeCompare(b[0]));save();toast(`${added} nieuwe weken toegevoegd. Dubbele datums overgeslagen.`)})}function undoImport(){if(!window._lastImport)return toast('Er is geen import uit deze browsersessie om terug te draaien.');db.history=window._lastImport.history;db.weighins=window._lastImport.weighins;window._lastImport=null;save();toast('Laatste import teruggedraaid.')}
// Browser compatibility: use native HTML/CSS/Canvas and localStorage; no build system required.
render();
</script><script>
(function(){
  const version='2026-10-29-privacy-1';
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline modus niet beschikbaar',err)));
  }
  function announce(next){
    if(document.getElementById('eetschaal-update-banner'))return;
    const banner=document.createElement('div');banner.id='eetschaal-update-banner';
    banner.setAttribute('role','status');
    banner.style.cssText='position:fixed;z-index:9999;top:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;gap:8px;align-items:center;justify-content:space-between;background:#203b58;color:#d6edff;border-bottom:1px solid #79c4ff;padding:11px 14px;font:13px system-ui';
    const info=document.createElement('span');info.textContent='Nieuwe Eetschaal-versie beschikbaar ('+next+'). Je ingevoerde gegevens blijven op dit apparaat bewaard.';
    const update=document.createElement('button');update.textContent='Vernieuwen';update.style.cssText='border:1px solid #79c4ff;background:#275d8c;border-radius:8px;color:white;padding:7px';update.onclick=()=>location.reload();
    banner.append(info,update);document.body.append(banner);
  }
  async function checkForUpdate(){
    if(location.protocol==='file:')return;
    try{const res=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});if(!res.ok)return;const data=await res.json();if(data.version&&data.version!==version)announce(data.version)}catch(e){}
  }
  window.addEventListener('focus',checkForUpdate);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate()});
  setInterval(checkForUpdate,300000);setTimeout(checkForUpdate,2000);
})();
</script></body></html>
